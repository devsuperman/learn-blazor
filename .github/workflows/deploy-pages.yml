name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/LearnBlazor/LearnBlazor.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          cd publish/wwwroot
          # The site is served from /<repo-name>/, not from the domain root.
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' index.html
          # Deep links (e.g. /topic/level-01-render-modes) get Pages' 404 page: make it the app.
          cp index.html 404.html
          # Don't let Jekyll hide the _framework folder.
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
